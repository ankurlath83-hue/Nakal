<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1E2740">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Bahi - Bills and Ledger</title>
<style>
/* ============================================================
   DESIGN RULES (keep to these when adding anything)
   Spacing: 4 8 12 16 24 32 only (--s1 .. --s6)
   Text:    14 small labels, 16 body, 20 titles, 32 key numbers
   Touch:   everything you can press is at least 44px tall
   ============================================================ */
:root{
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --t1:14px; --t2:16px; --t3:20px; --t4:32px;
  --bg:#F6F1E4; --card:#FFFDF6; --ink:#1E2740; --mut:#6F6A5C; --line:#E2D8C2;
  --green:#157F43; --greenbg:#E3F3E7; --red:#C2352B; --redbg:#FBE6E2;
  --pri:#1E2740; --prit:#FFFDF6; --acc:#D9831F; --key:#FFFDF6; --keyd:#EDE5D2;
  --shadow:0 1px 2px rgba(30,39,64,.08),0 4px 16px rgba(30,39,64,.06);
}
[data-theme=dark]{
  --bg:#14161B; --card:#1D2027; --ink:#EEE8DA; --mut:#A29E92; --line:#30343E;
  --green:#4CC38A; --greenbg:#17332A; --red:#FF7B6B; --redbg:#3A1F1E;
  --pri:#EEE8DA; --prit:#14161B; --acc:#F0A54A; --key:#262A33; --keyd:#30343E;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:var(--t2)/1.35 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif;
  user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}

/* ---------- App frame ---------- */
#app{height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
header{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s4);border-bottom:1px solid var(--line)}
header .biz{font-weight:700;font-size:var(--t3);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sync{font-size:var(--t1);color:var(--mut);display:flex;align-items:center;gap:var(--s1);white-space:nowrap}
header .sync i{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
header .sync.warn i{background:var(--acc)}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex:none}
#stage{flex:1;position:relative;overflow:hidden}
#main{position:absolute;inset:0;overflow:auto;padding:var(--s3) var(--s4) var(--s5)}
#main.led{display:flex;flex-direction:column;padding:0;overflow:hidden}
#main.billp{padding-bottom:0}
nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
nav button{flex:1;min-height:56px;padding:var(--s2) 0;font-size:var(--t1);color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .15s}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--ink);font-weight:700}
.hide{display:none!important}

/* ---------- Common pieces ---------- */
h2{font-size:var(--t3);margin:var(--s1) 0 var(--s3)}
.mut{color:var(--mut)} .sm{font-size:var(--t1)} .g{color:var(--green)} .r{color:var(--red)}
.big{font-size:var(--t4);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.mid{font-size:var(--t3);font-weight:800;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:var(--s2)}
.sp{flex:1;min-width:0}
.row.wrap{flex-wrap:wrap}
.mt2{margin-top:var(--s2)} .mt3{margin-top:var(--s3)} .mt4{margin-top:var(--s4)} .mt5{margin-top:var(--s5)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.btn{display:flex;align-items:center;justify-content:center;gap:var(--s2);min-height:52px;padding:0 var(--s4);border-radius:16px;font-weight:700;
  background:var(--card);border:1px solid var(--line);transition:transform .08s,background .15s,opacity .15s,box-shadow .15s}
.btn:active{transform:scale(.97);background:var(--keyd)}
.btn.pri{background:var(--pri);color:var(--prit);border-color:var(--pri)}
.btn.pri:active{opacity:.85;background:var(--pri)}
.btn.green{background:var(--green);color:#fff;border-color:var(--green)}
.btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.btn.green:active,.btn.red:active{opacity:.85}
.btn.ghost{background:none;border-color:transparent;color:var(--mut);min-height:44px}
.btn.wide{width:100%}
.pwin{width:100%;min-height:48px;padding:0 var(--s3);border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:var(--t2);user-select:text;-webkit-user-select:text}
.pwin:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.busy{pointer-events:none;opacity:.7}
.btn.busy::after{content:"";width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chip{min-height:44px;display:inline-flex;align-items:center;padding:0 var(--s4);border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:var(--t1);white-space:nowrap;transition:background .15s,transform .08s}
.chip.on{background:var(--pri);color:var(--prit);border-color:var(--pri)}
.chip:active{transform:scale(.96)}
.chips{display:flex;gap:var(--s2);overflow-x:auto;padding:2px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.badge{font-size:var(--t1);font-weight:700;padding:0 var(--s2);border-radius:999px;background:var(--redbg);color:var(--red)}
.empty{text-align:center;color:var(--mut);padding:var(--s6) var(--s5)}
.empty b{display:block;color:var(--ink);font-size:var(--t3);margin-bottom:var(--s1)}
.xbtn{width:44px;height:44px;display:grid;place-items:center;color:var(--mut);font-size:var(--t3);border-radius:12px;flex:none}
.xbtn:active{background:var(--keyd)}

/* ---------- Entry fields (the app's own, never a system input) ---------- */
.fld{min-height:48px;padding:0 var(--s3);border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:var(--t2);
  white-space:nowrap;overflow:hidden;cursor:text;display:flex;align-items:center;transition:border-color .15s,box-shadow .15s}
.fld:empty::before{content:attr(data-ph);color:var(--mut);font-weight:400}
.fld.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.fld.on::after{content:"";width:2px;height:1.1em;background:var(--acc);margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.fld.num{justify-content:flex-end;font-variant-numeric:tabular-nums}
.fld.bad{border-color:var(--red);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
label.lb{display:block;font-size:var(--t1);color:var(--mut);margin:var(--s3) 2px var(--s1)}

/* ---------- Bill screen ---------- */
.bhead,.brow{display:grid;grid-template-columns:minmax(0,1fr) 56px 56px 70px 44px;gap:var(--s1);align-items:center}
.bhead{font-size:var(--t1);color:var(--mut);padding:0 2px;margin-top:var(--s4)}
.bhead span:nth-child(n+2){text-align:right}
.brow{margin-top:var(--s2)}
.brow .fld{padding:0 var(--s2);min-height:44px}
.brow .sub{text-align:right;font-variant-numeric:tabular-nums;font-size:var(--t1);overflow:hidden}
#main.billp .fld{scroll-margin-bottom:104px}   /* keep the box being typed in clear of the Save bar */
.keys button[data-k="×"],.keys button[data-k="+"]{font-size:var(--t3)}
.tot{display:flex;justify-content:space-between;align-items:center;padding:var(--s1) 2px;min-height:32px}
.bbar{position:sticky;bottom:0;display:flex;align-items:center;gap:var(--s3);margin:var(--s3) calc(-1 * var(--s4)) 0;padding:var(--s2) var(--s4) var(--s3);
  background:var(--bg);border-top:2px solid var(--ink)}
.bbar .btn{flex:1;max-width:220px;margin-left:auto}
.tip{background:var(--card);border:1px dashed var(--acc);border-radius:12px;padding:var(--s2) var(--s1) var(--s2) var(--s3);font-size:var(--t1);display:flex;gap:var(--s2);margin-bottom:var(--s3);align-items:flex-start}
.tip div{flex:1;padding:var(--s1) 0}

/* ---------- Ledger screen (notebook look) ---------- */
.ltop{padding:var(--s2) var(--s4);border-bottom:1px solid var(--line)}
.pname{font-size:var(--t3);font-weight:700;display:flex;align-items:center;gap:var(--s1);min-height:44px;max-width:52%;min-width:0;flex:0 1 auto}
.pname span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bal{transition:color .3s}
.bal.pop{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.1)}}
.llist{flex:1;overflow:auto;min-height:0;background:
  repeating-linear-gradient(var(--card),var(--card) 47px,var(--line) 47px,var(--line) 48px) local}
.llist.two{overflow:hidden}   /* each side scrolls on its own, so both show their newest entries */
/* two sides like a notebook: Paid on the left, Bill on the right */
.lheads,.lsides{display:grid;grid-template-columns:1fr 1fr}
.lheads{border-bottom:1px solid var(--line);font-size:var(--t1)}
.lheads div{display:flex;justify-content:space-between;gap:var(--s2);padding:var(--s1) var(--s3);min-width:0}
.lheads div + div,.lside + .lside{border-left:2px solid var(--line)}
.lsides{min-height:100%}
.llist.two .lsides{height:100%;min-height:0}
.lside{min-width:0}
.llist.two .lside{overflow-y:auto;overscroll-behavior:contain;background:
  repeating-linear-gradient(var(--card),var(--card) 47px,var(--line) 47px,var(--line) 48px) local}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:var(--s2);align-content:center;height:48px;padding:0 var(--s3);font-variant-numeric:tabular-nums;width:100%;text-align:left}
.lrow .d{font-size:var(--t1);color:var(--mut);white-space:nowrap;overflow:hidden;line-height:1.15}
.lrow .a{font-weight:700;text-align:right;line-height:1.15}
.lrow .n{grid-column:1/-1;font-size:var(--t1);color:var(--mut);line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow.new{animation:slidein .35s}
@keyframes slidein{from{opacity:0;transform:translateY(12px)}}
.lentry{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:var(--s2);padding:var(--s2) var(--s4);border-top:1px solid var(--line);background:var(--bg)}
.lentry .amt{font-size:var(--t3);font-weight:800}
.datechip{display:flex;align-items:center;padding:0 var(--s3);border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;min-height:48px;white-space:nowrap;transition:background .15s}
.datechip:active{background:var(--keyd)}
.datechip.old{border-color:var(--acc);color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}   /* date is not today: easy to notice */
.psum{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);padding:var(--s3) var(--s4);margin-top:var(--s3)}
.nudge{display:flex;gap:var(--s2);align-items:center;background:var(--card);border:1px solid var(--acc);border-radius:12px;padding:var(--s2) var(--s1) var(--s2) var(--s3);font-size:var(--t1);margin-bottom:var(--s3)}
.nudge .btn{min-height:44px;padding:0 var(--s3);font-size:var(--t1)}

/* ---------- Party cards and menus ---------- */
.pcard{padding:var(--s3) var(--s4);margin-top:var(--s2);display:block;width:100%;text-align:left;min-height:48px;transition:background .15s,transform .08s}
.pcard:active{background:var(--keyd);transform:scale(.99)}
.pcard .t{display:flex;justify-content:space-between;gap:var(--s3);font-weight:700}
.pcard .t span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .s{font-size:var(--t1);color:var(--mut);margin-top:var(--s1);display:flex;gap:var(--s1) var(--s3);flex-wrap:wrap;align-items:center}
.menu{margin-top:var(--s2);overflow:hidden}
.menu button,.menu a{display:flex;width:100%;align-items:center;gap:var(--s3);min-height:52px;padding:var(--s2) var(--s4);border-bottom:1px solid var(--line);text-align:left;transition:background .15s}
.menu > :last-child{border-bottom:0}
.menu button:active,.menu a:active{background:var(--keyd)}
.menu .v{margin-left:auto;color:var(--mut);font-size:var(--t1);text-align:right}
.sect{font-size:var(--t1);font-weight:700;color:var(--mut);margin:var(--s5) var(--s1) 0}

/* ---------- Sheets (bottom dialogs built into the page) ---------- */
#sheet{position:absolute;inset:0;background:rgba(10,12,20,.45);display:flex;flex-direction:column;justify-content:flex-end;z-index:5}
#sheet .box{background:var(--bg);border-radius:24px 24px 0 0;padding:var(--s4) var(--s4) var(--s5);max-height:100%;overflow:auto;animation:up .2s}
@keyframes up{from{transform:translateY(32px);opacity:.5}}
#sheet h3{margin:0 0 var(--s1);font-size:var(--t3)}
#sheet .acts{display:flex;gap:var(--s2);margin-top:var(--s4)}
#sheet .acts .btn{flex:1;min-width:0}
.sharetext{user-select:text;-webkit-user-select:text;white-space:pre-wrap;font:var(--t1)/1.4 inherit;font-family:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:var(--s3);max-height:24vh;overflow:auto;margin:var(--s3) 0 0}
.wheel{display:flex;gap:var(--s2);height:176px;position:relative;margin-top:var(--s3)}
.wheel::before{content:"";position:absolute;left:0;right:0;top:66px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.wheel .col{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;position:relative;scrollbar-width:none;text-align:center}
.wheel .col::-webkit-scrollbar{display:none}
.wheel .col div{height:44px;line-height:44px;scroll-snap-align:center;font-size:var(--t3);font-weight:600}
.wheel .col::before,.wheel .col::after{content:"";display:block;height:66px}

/* ---------- Toast: sits over the title bar so it never covers a field or button in use ---------- */
#toast{position:absolute;left:var(--s2);right:var(--s2);top:var(--s1);min-height:52px;z-index:8;background:var(--ink);color:var(--bg);border-radius:16px;padding:var(--s1) var(--s1) var(--s1) var(--s4);
  display:flex;align-items:center;gap:var(--s3);box-shadow:var(--shadow);animation:drop .2s}
@keyframes drop{from{transform:translateY(-16px);opacity:.5}}
#toast button{margin-left:auto;font-weight:800;color:var(--acc);min-height:44px;min-width:64px;padding:0 var(--s3);border-radius:12px}
#toast button:active{background:rgba(255,255,255,.12)}

/* ---------- Keypads ---------- */
#kb{background:var(--keyd);border-top:1px solid var(--line);padding:var(--s2) var(--s2) var(--s2)}
#sugg{display:flex;gap:var(--s2);overflow-x:auto;padding:0 0 var(--s2);scrollbar-width:none}
#sugg:empty{display:none}
#sugg::-webkit-scrollbar{display:none}
#sugg button{flex:none;min-height:44px;min-width:48px;padding:0 var(--s4);   /* flex:none = never squeezed; the row scrolls sideways */border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:var(--t1);white-space:nowrap}
#sugg button:active{background:var(--line)}
#sugg button small{font-size:var(--t1);color:var(--mut);margin-left:var(--s2)}
.keys{display:grid;gap:var(--s2)}
.keys.n{grid-template-columns:repeat(4,1fr)}
.keys button{height:52px;border-radius:12px;background:var(--key);font-size:var(--t3);font-weight:600;box-shadow:0 1px 0 rgba(0,0,0,.12);touch-action:manipulation;transition:background .08s}
.keys button:active{background:var(--line);transform:translateY(1px)}
.keys .fn{font-size:var(--t2);background:var(--bg)}
.keys .go{background:var(--pri);color:var(--prit);font-size:var(--t2)}
.keys .paid{background:var(--green);color:#fff;font-size:var(--t2)}
.keys .bill{background:var(--red);color:#fff;font-size:var(--t2)}
.keys .go:active,.keys .paid:active,.keys .bill:active{opacity:.8}
.keys.a{grid-template-columns:repeat(20,1fr);gap:var(--s1)}
.keys.a button{grid-column:span 2;height:48px;padding:0}
.keys.a .w3{grid-column:span 3}.keys.a .w4{grid-column:span 4}.keys.a .w8{grid-column:span 8}.keys.a .off1{grid-column:2/span 2}
body.desk #kb .keys.hidek{display:none}
.kbbar{display:flex;align-items:center;gap:var(--s3);font-size:var(--t1);color:var(--mut);padding:0 var(--s1) var(--s2)}
.kbbar button{margin-left:auto;text-decoration:underline;min-height:44px}

/* ---------- PIN pad, lock and welcome ---------- */
.center{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:var(--s3);padding:var(--s3)}
.logo{width:64px;height:64px}
.hero{font-size:var(--t4);font-weight:800;line-height:1.1;margin:0;max-width:100%;overflow-wrap:anywhere}
.hero span{display:inline-block;white-space:nowrap}
.hero i{display:inline-block;font-style:normal;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.hero.still i{animation:none}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
.dots{display:flex;gap:var(--s3);margin:var(--s4) 0 var(--s1)}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);transition:background .1s}
.dots i.f{background:var(--ink)}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:var(--s3);margin-top:var(--s2)}
.pinpad button{height:64px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:var(--t4);font-weight:600;line-height:1;display:grid;place-items:center;transition:background .08s,transform .08s}
.pinpad button:active{background:var(--keyd);transform:scale(.95)}
.pinpad .nb{background:none;border:0}
.err{color:var(--red);min-height:24px;font-size:var(--t1)}
.steps{display:flex;gap:var(--s2);margin:var(--s2) 0}
.steps i{width:32px;height:4px;border-radius:2px;background:var(--line)}
.steps i.f{background:var(--acc)}
.onb{max-width:380px;width:100%;text-align:left}
.onb .hero{margin:var(--s2) 0}

/* ---------- Pointer hover (laptop). Phones never see these. ---------- */
@media (hover:hover){
  .btn:hover{box-shadow:0 0 0 2px var(--line)}
  .btn.pri:hover,.btn.green:hover,.btn.red:hover{opacity:.9;box-shadow:none}
  .btn.ghost:hover{color:var(--ink);box-shadow:none}
  .chip:hover,.iconbtn:hover,.datechip:hover,.pcard:hover,.menu button:hover,.menu a:hover,#sugg button:hover,.pinpad button:hover,.xbtn:hover{background:var(--keyd)}
  .chip.on:hover{background:var(--pri);opacity:.9}
  .keys button:hover{background:var(--line)}
  .keys .go:hover,.keys .paid:hover,.keys .bill:hover{opacity:.9}
  .lrow:hover{background:color-mix(in srgb,var(--acc) 10%,transparent)}
  .fld:hover{border-color:var(--acc)}
  nav button:hover{color:var(--ink)}
}
/* short phones: slimmer keys and sheets so Save stays visible above the keypad */
@media (max-height:700px){
  .keys button{height:44px} .keys.a button{height:44px} #kb{padding:var(--s1) var(--s2)} #sugg{padding-bottom:var(--s1)}
  #sheet .box{padding:var(--s3) var(--s4) var(--s4)} #sheet .acts{margin-top:var(--s3)} .btn{min-height:48px}
}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01s!important;transition-duration:.01s!important} }
</style>
</head>
<body>
<div id="app">
  <header id="hdr" class="hide">
    <div class="biz" id="bizname"></div>
    <div class="sync" id="sync"><i></i><span></span></div>
    <button class="iconbtn" data-act="lockNow" aria-label="Lock">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    </button>
  </header>
  <div id="stage">
    <main id="main"></main>
    <div id="sheet" class="hide"></div>
  </div>
  <div id="toast" class="hide"></div>
  <div id="kb" class="hide"></div>
  <nav id="nav" class="hide"></nav>
</div>
<input type="file" id="file" accept=".json,application/json" class="hide">
<input type="file" id="csvfile" accept=".csv,.nkbackup,text/csv,text/plain,application/octet-stream" class="hide">

<script>
"use strict";
/* =====================================================================
   BAHI - bills + party ledger in one app.
   One file, no build step. Sections:
     1. Words (English / Hindi)        6. Entry fields and keypads

const KDF_ITER = 600000, PIN_LEN = 6;

function newBook(name){ return {bookId:randB64(9), appVer:APP_VER, biz:{name:name||""}, set:{lang:LANG, theme:"auto", credit:30, lock:2, round:false}, parties:[], entries:[], bills:[], items:[], cash:{}, seq:1, billSeq:1, tipDone:false, rev:Date.now()}; }
function migrate(b){

    const seen = new Map();
    for(let i=(b.bills||[]).length-1;i>=0;i--) for(const r of b.bills[i].rows){ const k = r.item.toLowerCase(); if(r.item && !seen.has(k)) seen.set(k, {id:b.seq++, name:r.item, rate:r.rate, unit:""}); }
    b.items = [...seen.values()];
  }
  const d = newBook(""); delete d.appVer; for(const k in d) if(b[k]===undefined) b[k] = d[k]; for(const k in d.set) if(b.set[k]===undefined) b.set[k] = d.set[k]; return b; }

/** One pass over all entries: balance, turnover, last dates and overdue days for every party. */
function allStats(){
  const m = new Map(); const now = today();
  S.parties.forEach(p => m.set(p.id, {bal:0, turn:0, paid:0, lastPaid:null, lastBill:null, bills:[], overdue:0}));
  for(const e of S.entries){
    const s = m.get(e.pid); if(!s) continue;
    if(e.type==="bill"){ s.bal += e.amt; s.turn += e.amt; s.bills.push(e); if(!s.lastBill || e.date>s.lastBill) s.lastBill = e.date; }
    else { s.bal -= e.amt; s.paid += e.amt; if(!s.lastPaid || e.date>s.lastPaid) s.lastPaid = e.date; }
  }
  // Overdue: payments clear the oldest bills first; the oldest bill still open decides the delay.
  for(const p of S.parties){
    const s = m.get(p.id); s.bal = r2(s.bal); s.turn = r2(s.turn);
    if(s.bal <= 0) continue;
    let pool = s.paid;
    for(const b of s.bills.sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:a.id-b.id)){
      if(pool >= b.amt - 0.005){ pool -= b.amt; continue; }
      const late = dayDiff(b.date, now) - (p.credit==null ? S.set.credit : p.credit);
      if(late > 0) s.overdue = late; break;
    }
  }
  return m;
}

  if(k==="month") return [iso(new Date(y,m,1)), iso(new Date(y,m+1,0))];
  if(k==="last") return [iso(new Date(y,m-1,1)), iso(new Date(y,m,0))];
  if(k==="year"){ const fy = m>=3 ? y : y-1; return [fy+"-04-01", (fy+1)+"-03-31"]; }
  return ["0000-00-00","9999-99-99"];
}
function itemReport(k){
  const [a,b] = repRange(k), m = new Map();
  for(const bill of S.bills){ if(bill.date<a || bill.date>b) continue;
    for(const r of bill.rows){ const key = (r.item||"-").toLowerCase(); let o = m.get(key); if(!o){ o = {item:r.item||"-", qty:0, amt:0, ids:new Set()}; m.set(key,o); }
      o.qty += r.qty; o.amt += r2(r.rate*r.qty); o.ids.add(bill.id); } }
  return [...m.values()].map(o => ({item:o.item, qty:Math.round(o.qty*1000)/1000, amt:r2(o.amt), n:o.ids.size})).sort((x,y)=> y.amt-x.amt || x.item.localeCompare(y.item));
}
/** Item names with rates for suggestions: the catalogue first, then anything else billed before. */
function knownItems(){
  const seen = new Map();
  for(const x of S.items) seen.set(x.name.toLowerCase(), {item:x.name, rate:x.rate});
  for(let i=S.bills.length-1;i>=0;i--) for(const r of S.bills[i].rows){ const k = r.item.toLowerCase(); if(r.item && !seen.has(k)) seen.set(k, {item:r.item, rate:r.rate}); }
  return [...seen.values()];
}

   6. ENTRY FIELDS AND KEYPADS
   Fields are plain boxes bound to a path inside D (the drafts).
   The app's own keypad, or a real keyboard on a computer, edits
   the draft; the phone keyboard is never opened.
   --------------------------------------------------------------- */
const blankBill = () => ({id:null, party:"", date:today(), rows:[{item:"",rate:"",qty:""}], transport:"", roundOn:!!(S && S.set.round)});   // round off follows the last choice
const D = { bill:blankBill(), led:{amt:"", note:"", date:today()}, q:{parties:"", bills:"", pick:"", items:""}, edit:{amt:"", note:"", date:"", type:"paid"}, item:{name:"", rate:"", unit:""},
            party:{name:"", phone:"", credit:""}, cash:{}, onb:{biz:"", party:""}, set:{biz:"", credit:""} };
const UI = { mode:"loading", tab:"bill", sub:null, pid:null, sheet:null, onb:0, rep:"month", pf:"all", alt:false, showKeys:false, lastNew:null };
let F = null;   // the active field: {path, kind}
const DESK = window.matchMedia && matchMedia("(hover:hover) and (pointer:fine)").matches;
if(DESK) document.body.classList.add("desk");

/** HTML for one field box. kind: text | num | int | tel */
/** Work out a sum typed in a calc box, e.g. "2×290+100" = 680. Unfinished parts count as nothing. */
function evalCalc(s){
  return r2(String(s||"").split("+").reduce((sum, term) => {
    const f = term.split("×").filter(x => x !== "" && x !== ".");
    return sum + (f.length ? f.reduce((p,x) => p*num(x), 1) : 0);
  }, 0));
}
/** "2×290" -> "2 × 290" (Indian commas on each number). */
const calcPlain = v => String(v).split(/([×+])/).map(x => x==="×"||x==="+" ? ` ${x} ` : typed(x)).join("");
/** What a calc box shows: "2 × 290 = 580" once there is a sum to show. */
function calcShow(v){ v = String(v||""); if(!/[×+]/.test(v)) return typed(v); return calcPlain(v) + (/\d$/.test(v) ? ` = ${plain(evalCalc(v))}` : ""); }
const showVal = (kind, v) => kind==="calc" ? calcShow(v) : (kind==="num"||kind==="int") ? typed(v) : v;
function fld(path, kind, ph, cls){
  const v = getPath(D, path) || "";
  return `<div class="fld ${kind!=="text"&&kind!=="tel"?"num":""} ${cls||""}" data-path="${path}" data-kind="${kind}" data-ph="${esc(ph)}">${esc(showVal(kind, v))}</div>`;
}
const fldEl = path => $(`.fld[data-path="${path}"]`);
function paintField(path){ const el = fldEl(path); if(!el) return; el.textContent = showVal(el.dataset.kind, getPath(D,path)||""); el.scrollLeft = el.scrollWidth; }
function focusField(path){
  const el = fldEl(path); if(!el) return;
  $$(".fld.on").forEach(e => e.classList.remove("on"));
  el.classList.add("on"); el.classList.remove("bad");
  F = {path, kind:el.dataset.kind};
  drawKeys(); el.scrollIntoView({block:"nearest"}); el.scrollLeft = el.scrollWidth;   // long names: show the end where the cursor is
}
function blurField(){ F = null; $$(".fld.on").forEach(e => e.classList.remove("on")); drawKeys(); }
/** Order of fields on screen; Next / Enter / Tab walks this list. */
function fieldOrder(){ const root = UI.sheet ? $("#sheet") : $("#main"); return $$(".fld", root).map(e => e.dataset.path); }
function nextField(back){
  if(!F) return;
  const p = F.path, m = p.match(/^bill\.rows\.(\d+)\.(item|rate|qty)$/);
  if(m && !back){
    const i = +m[1], rows = D.bill.rows, row = rows[i], last = i===rows.length-1;
    // rate is the last box in a row: open the next row
    if(m[2]==="rate" && last && (row.item || num(row.qty))){ rows.push({item:"",rate:"",qty:""}); render(); return focusField(`bill.rows.${i+1}.item`); }
    if(m[2]==="item" && last && i>0 && !row.item) return focusField("bill.transport");
  }
  if(p==="led.note" && !back) return focusField("led.amt");
  const o = fieldOrder(), i = o.indexOf(p), n = o[i + (back?-1:1)];
  if(n) focusField(n); else if(!back){ const b = $("[data-enter]", UI.sheet ? $("#sheet") : $("#main")); blurField(); if(b) b.click(); }
}
/** Apply one key to the active field. */
function typeKey(k){
  if(!F) return;
  let v = String(getPath(D, F.path) || ""); const kind = F.kind;
  if(k==="BS") v = v.slice(0,-1);
  else if(k==="CLR") v = "";
  else if(kind==="text"){ if(v.length < 40){ if(k===" " && (!v || v.endsWith(" "))) return; v += k; } }
  else if(kind==="calc"){                       // numbers joined by × and +
    if(k==="×" || k==="+"){
      if(!v) return;
      if(/[×+.]$/.test(v)) v = v.slice(0,-1);   // a second sign replaces the first
      if(!v) return; v += k;
    } else {
      const term = v.split(/[×+]/).pop();
      if(k==="."){ if(term.includes(".")) return; v += term ? "." : "0."; }
      else if(/^\d+$/.test(k)){
        if(k==="00" && !term) return;
        const [a,b] = term.split(".");
        if(b!==undefined){ if(b.length + k.length > 2) return; }
        else if(a.length + k.length > 7) return;
        if(term==="0") v = v.slice(0,-1);
        v += k;
      } else return;
    }
    if(v.length > 32) return;
  }
  else {
    if(k==="."){ if(kind!=="num" || v.includes(".")) return; v = v ? v+"." : "0."; }
    else if(/^\d+$/.test(k)){
      if(k==="00" && !v) return;
      const [a,b] = v.split(".");
      if(b!==undefined){ if(b.length + k.length > 3) return; }
      else if(a.length + k.length > (kind==="tel"?10:9)) return;
      v = (v==="0" ? "" : v) + k;
    } else return;
  }
  setPath(D, F.path, v); paintField(F.path); onInput(F.path);
}
/** Capital letter at the start of each word, small letters after. */
const caseFor = ch => { if(!F) return ch; const v = String(getPath(D,F.path)||""); return (!v || v.endsWith(" ")) ? ch.toUpperCase() : ch.toLowerCase(); };

/** Things that must refresh while typing, without redrawing the whole screen. */
function onInput(path){
  if(path.startsWith("bill.")) paintBillTotals();
  else if(path==="q.parties") $("#plist").innerHTML = partyListHTML();
  else if(path==="q.bills") $("#blist").innerHTML = billListHTML();
  else if(path==="q.pick") $("#picklist").innerHTML = pickListHTML();
  else if(path==="q.items") $("#ilist").innerHTML = itemListHTML();
  else if(path.startsWith("cash.")) paintCash();
  drawSugg();
}

/* ---- Suggestions above the keypad ---- */
function suggestions(){
  if(!F || !S) return [];
  const v = String(getPath(D,F.path)||"").toLowerCase();
  if(F.path==="bill.party"){
    return S.parties.filter(p => p.name.toLowerCase().includes(v) && p.name.toLowerCase()!==v).slice(0,8).map(p => ({label:p.name, set:{[F.path]:p.name}, next:true}));
  }
  const m = F.path.match(/^bill\.rows\.(\d+)\.item$/);
  if(m){
    return knownItems().filter(x => x.item.toLowerCase().includes(v) && x.item.toLowerCase()!==v).slice(0,8)
      .map(x => ({label:x.item, sub:x.rate ? "₹"+plain(x.rate) : "", set:{[F.path]:x.item, [`bill.rows.${m[1]}.rate`]:String(x.rate)}, to:`bill.rows.${m[1]}.qty`}));
  }
  if(F.path==="led.note" || F.path==="led.amt") return t("quick").map(x => ({label:x, set:{"led.note":x}}));
  if(F.path==="edit.note" || F.path==="edit.amt") return t("quick").map(x => ({label:x, set:{"edit.note":x}}));
  return [];
}
let SUGG = [];
function drawSugg(){ const el = $("#sugg"); if(!el) return; SUGG = suggestions(); el.innerHTML = SUGG.map((s,i)=>`<button data-sg="${i}">${esc(s.label)}${s.sub?`<small>${esc(s.sub)}</small>`:""}</button>`).join(""); el.scrollLeft = 0; }

      + `<button data-k="CLR" class="fn w4">${t("clear")}</button><button data-k=" " class="w8">space</button><button data-k="." class="w3">.</button><button data-k="NEXT" class="go" style="grid-column:span 5">${t("next")}</button>`
      + `</div>`;
  } else {
    const led = F.path==="led.amt";

    const d = c => `<button data-k="${c}">${c}</button>`, calc = F.kind==="calc";

    keys = `<div class="keys n ${hidek}">${d(7)}${d(8)}${d(9)}${side[0]}${d(4)}${d(5)}${d(6)}${side[1]}${d(1)}${d(2)}${d(3)}${side[2]}${calc?`<button data-k="×" class="fn">×</button>`:d("00")}${d(0)}${F.kind==="num"||calc?d("."):"<span></span>"}${side[3]}</div>`;
    if(led && hidek) keys += `<div class="keys n" style="grid-template-columns:1fr 1fr"><button data-k="PAID" class="paid">${t("paid")} (P)</button><button data-k="BILL" class="bill">${t("billed")} (B)</button></div>`;
  }
  kb.innerHTML = `<div id="sugg"></div>${bar}${keys}`;
  drawSugg();

/** A keypad key was pressed (touch or mouse). */
function pressKey(k){
  if(k==="NEXT") return nextField();
  if(k==="ALT"){ UI.alt = !UI.alt; return drawKeys(); }
  if(k==="NOTE") return focusField("led.note");
  if(k==="PAID") return A.addEntry("paid");
  if(k==="BILL") return A.addEntry("bill");
  if(F && F.kind==="text" && k.length===1 && /[a-z]/i.test(k)) k = caseFor(k);
  typeKey(k);
}

function pinKey(k){
  PIN.shown = true;
  if(PIN.busy || !PIN.done) return;
  if(k==="BS") PIN.buf = PIN.buf.slice(0,-1); else if(PIN.buf.length < PIN_LEN) PIN.buf += k;

/* ---- Lock screen ---- */
function lockHTML(){ return `<div class="center">${LOGO}${heroHTML((ls.get(LS_UI)||{}).biz || "Bahi", !!PIN.err || PIN.shown)}${pinHTML()}<button class="btn ghost" data-act="forgot">${t("forgot")}</button></div>`; }
async function lockLoop(){
  UI.mode = "lock"; UI.sheet = null; F = null; PIN.shown = false;
  const vault = ls.get(LS_VAULT) || Cloud.vault;
  for(;;){
    const tr = ls.get(LS_TRY) || {n:0, until:0};
    const waitS = Math.ceil((tr.until - Date.now())/1000);
    if(waitS > 0){ pinFail(t("wait", waitS)); }
    const pin = await askPin(t("enterPin"), "");
    if(UI.mode!=="lock") return;                    // erased or restored meanwhile
    const tr2 = ls.get(LS_TRY) || {n:0, until:0};
    if(tr2.until > Date.now()){ pinFail(t("wait", Math.ceil((tr2.until-Date.now())/1000))); continue; }
    try{
      const key = await deriveKey(pin, vault.salt, vault.iter);
      const book = await decryptObj(key, vault);
      KEY = key; V = {salt:vault.salt, iter:vault.iter}; S = migrate(book); heldPin = pin;
      ls.del(LS_TRY); PIN.err = ""; enterApp(); return;
    }catch(e){
      const n = tr2.n + 1;                          // slow down guessing: 5 free tries, then 30 s, 60 s, 120 s ... up to 15 min
      ls.set(LS_TRY, {n, until: n>=5 ? Date.now() + Math.min(900, 30*Math.pow(2,n-5))*1000 : 0});
      pinFail(n>=5 ? t("wait", Math.min(900, 30*Math.pow(2,n-5))) : t("wrongPin"));
    }
  }
}
function enterApp(){
  if(S.appVer !== APP_VER){
    const v = ls.get(LS_VAULT), had = S.entries.length || S.parties.length || S.bills.length;
    if(v && had) ls.set(LS_PREV, {...v, fromVer:S.appVer || "older", savedAt:Date.now()});   // undo path for this update
    S.appVer = APP_VER; commit();
    if(had) setTimeout(()=>toast(t("appUpdated", APP_VER)), 600);
  }

function billMath(b){ let sub = 0; const subs = b.rows.map(r => { const s = r2(num(r.rate)*num(r.qty)); sub += s; return s; }); sub = r2(sub);
  const raw = r2(sub + evalCalc(b.transport)), grand = b.roundOn ? Math.round(raw) : raw;
  return {subs, sub, grand, round:r2(grand - raw)}; }
/** "+0.25" / "-0.40" for the round off line. */
const signed = n => (n > 0 ? "+" : n < 0 ? "-" : "") + Math.abs(n).toFixed(2);
function paintBillTotals(){
  const m = billMath(D.bill);
  m.subs.forEach((s,i)=>{ const el = $("#sub"+i); if(el) el.textContent = s ? plain(s) : ""; });
  const a = $("#bsub"), g = $("#bgrand"); if(a) a.textContent = money(m.sub); if(g) g.textContent = money(m.grand);
  const ro = $("#bround"); if(ro) ro.textContent = D.bill.roundOn && m.round ? signed(m.round) : "";
}

/** Parties ordered by their most recent entry, for one-tap switching. */
function recentParties(){

/** Draw a bill or statement on a canvas (works for Hindi too, since the device font draws it). */
function drawDoc(doc){
  const Wd = 900, P = 40, RH = 40, top = 70 + doc.sub.length*32 + 30;
  const H = top + RH*(doc.rows.length+1) + doc.foot.length*46 + 70;
  const c = document.createElement("canvas"); c.width = Wd; c.height = H; const x = c.getContext("2d");
  const font = (s,b) => x.font = `${b?"700 ":""}${s}px system-ui,"Noto Sans","Noto Sans Devanagari",sans-serif`;
  x.fillStyle = "#FFFDF6"; x.fillRect(0,0,Wd,H); x.fillStyle = "#1E2740"; x.textBaseline = "middle";
  font(34,true); x.fillText(doc.title, P, 50);
  font(22); doc.sub.forEach((s,i)=> x.fillText(s, P, 100 + i*32));
  const cw = doc.w.map(f => f*(Wd-2*P)); let y = top;
  const cell = (txt,i,yy,color) => { let cx = P; for(let k=0;k<i;k++) cx += cw[k]; x.fillStyle = color||"#1E2740";
    if(doc.al[i]==="r"){ x.textAlign = "right"; x.fillText(txt, cx+cw[i]-6, yy); } else { x.textAlign = "left"; let s = String(txt); while(s.length>1 && x.measureText(s).width > cw[i]-10) s = s.slice(0,-2)+"…"; x.fillText(s, cx+6, yy); } x.textAlign = "left"; };
  x.fillStyle = "#1E2740"; x.fillRect(P, y, Wd-2*P, RH); font(19,true); doc.head.forEach((h,i)=> cell(h,i,y+RH/2,"#FFFDF6")); y += RH;
  font(20); doc.rows.forEach(r => { r.forEach((v,i)=> cell(v,i,y+RH/2, doc.colors&&doc.colors[i])); x.fillStyle = "#E2D8C2"; x.fillRect(P, y+RH-1, Wd-2*P, 1); y += RH; });
  y += 14; doc.foot.forEach(f => { font(f[2]?28:22, f[2]); x.fillStyle = "#1E2740"; x.textAlign = "left"; x.fillText(f[0], P+6, y+23); x.textAlign = "right"; x.fillText(f[1], Wd-P-6, y+23); y += 46; });
  x.textAlign = "left"; font(15); x.fillStyle = "#7A7566"; x.fillText("Bahi", P, H-28);
  return c;
}

/* ---- Import a ledger CSV (Hisab Pad export, or Bahi's own ledger export) ----
   Columns are found by name: Party, Date, Type (Paid/Bill), Amount, Note, Struck out.
   Dates may be 12.11.26, 12/11/2026 or 2026-11-12. Struck-out rows are left out.
   Importing the same file twice adds nothing the second time. */
function parseCsv(text){
  const rows = []; let row = [], cell = "", q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if(c==='"') q = true;
    else if(c===","){ row.push(cell); cell = ""; }
    else if(c==="\n" || c==="\r"){ if(c==="\r" && text[i+1]==="\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if(cell || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function csvDate(s){
  s = String(s||"").trim(); let m;
  if((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) return `${m[1]}-${pad2(+m[2])}-${pad2(+m[3])}`;
  if((m = s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2}|\d{4})$/))){
    const d = +m[1], mo = +m[2], y = m[3].length===2 ? 2000 + +m[3] : +m[3];
    if(mo<1 || mo>12 || d<1 || d>new Date(y, mo, 0).getDate()) return null;
    return `${y}-${pad2(mo)}-${pad2(d)}`;
  }
  return null;
}
function readLedgerCsv(text){
  const rows = parseCsv(text.replace(/^\ufeff/, "")); if(rows.length < 2) return null;
  const head = rows[0].map(h => h.trim().toLowerCase());
  const col = names => head.findIndex(h => names.includes(h));
  const cP = col(["party","party name","name"]), cD = col(["date"]), cT = col(["type"]), cA = col(["amount","amt"]), cN = col(["note","notes"]), cS = col(["struck out","struck","deleted"]);
  if(cP<0 || cD<0 || cT<0 || cA<0) return null;
  const out = [], bad = [];
  for(const r of rows.slice(1)){
    const party = (r[cP]||"").trim(), type = (r[cT]||"").trim().toLowerCase(), amt = r2(num(r[cA])), date = csvDate(r[cD]);
    if(cS>=0 && /^(yes|y|true|1|struck|x)$/i.test((r[cS]||"").trim())) continue;
    const ty = /^(paid|jama|जमा|credit|cr)$/.test(type) ? "paid" : /^(bill|बिल|debit|dr)$/.test(type) ? "bill" : null;
    if(!party || !ty || !(amt>0) || !date){ bad.push(r.join(", ")); continue; }
    out.push({party, type:ty, amt, date, note:cN>=0 ? (r[cN]||"").trim() : ""});
  }
  return {rows:out, bad};
}
/** Work out what an import would add, without changing anything. */
function planImport(list){
  const key = (pname, e) => [pname.trim().toLowerCase(), e.date, e.type, e.amt, (e.note||"").trim().toLowerCase()].join("|");
  const have = new Map();
  for(const e of S.entries){ const p = partyById(e.pid); if(!p) continue; const k = key(p.name, e); have.set(k, (have.get(k)||0) + 1); }
  const add = []; let skip = 0;
  for(const r of list){ const k = key(r.party, r); if(have.get(k) > 0){ have.set(k, have.get(k)-1); skip++; } else add.push(r); }
  const now = today(), odd = add.filter(r => r.date < "2015-01-01" || r.date > now);
  const newP = new Set(add.filter(r => !findParty(r.party)).map(r => r.party.trim().toLowerCase())).size;
  const parties = new Set(list.map(r => r.party.trim().toLowerCase())).size;
  return {add, skip, odd, newP, parties, total:list.length,
    paid:r2(add.filter(r=>r.type==="paid").reduce((a,r)=>a+r.amt,0)), bill:r2(add.filter(r=>r.type==="bill").reduce((a,r)=>a+r.amt,0))};
}
function runImport(plan){

  commit(); UI.sheet = null; UI.tab = "parties"; render(); toast(t("imported", plan.add.length), true);
}
async function importCsvFile(file){
  let text = ""; try{ text = await file.text(); }catch(e){}
  if(/^\s*\{/.test(text)){                         // a Nakal backup (.nkbackup) is JSON, not CSV
    let f = null; try{ f = JSON.parse(text); }catch(e){}
    if(f && f.app==="nk-backup" && f.salt && f.ct){ openSheet({type:"nkpass", file:f, err:""}); setTimeout(()=>{ const i = $("#nkpw"); if(i) i.focus(); }, 50); return; }
    if(f && f.app==="bahi") return restoreVault(f);  // a Bahi backup picked here by mistake: restore it the normal way
    return toast(t("importBad"));
  }
  let res = null; try{ res = readLedgerCsv(text); }catch(e){}
  if(!res || !res.rows.length) return toast(t("importBad"));
  const plan = planImport(res.rows);
  if(!plan.add.length) return toast(t("importNone"));
  openSheet({type:"import", plan, bad:res.bad});
}

/* ---- Import a Nakal 2 backup (.nkbackup) ----
   The file is locked with the password chosen in Nakal (same AES-256 + PBKDF2 method as Bahi).
   Inside: records {id, t, d, del}: t "p" party {name, phone, creditDays}, "b" bill {no, partyId, date, rows[{item, qty, rate}], transport},
   "e" ledger entry {partyId, kind paid|bill, amt, date, note}, "i" item {name, rate, unit}. Deleted records are skipped. */
function nakalPlan(recs){
  const live = (recs||[]).filter(r => r && r.d && !r.del);
  const P = new Map(live.filter(r => r.t==="p").map(r => [r.id, r.d]));
  const pname = id => ((P.get(id)||{}).name || "").trim();
  const bills = live.filter(r => r.t==="b" && pname(r.d.partyId)).map(r => {
    const rows = (r.d.rows||[]).map(x => ({item:String(x.item||"").trim(), qty:num(x.qty), rate:num(x.rate)})).filter(x => x.qty*x.rate > 0);
    const transport = num(r.d.transport), total = r2(rows.reduce((a,x)=>a + r2(x.qty*x.rate), 0) + transport);
    return {party:pname(r.d.partyId), date:csvDate(r.d.date) || today(), no:+r.d.no || 0, rows, transport, total};
  }).filter(b => b.total > 0);
  const ents = live.filter(r => r.t==="e" && pname(r.d.partyId) && num(r.d.amt) > 0)
    .map(r => ({party:pname(r.d.partyId), type:r.d.kind==="paid" ? "paid" : "bill", amt:r2(num(r.d.amt)), date:csvDate(r.d.date) || today(), note:String(r.d.note||"").trim()}));
  const items = live.filter(r => r.t==="i" && r.d.name).map(r => ({name:String(r.d.name).trim(), rate:num(r.d.rate), unit:String(r.d.unit||"").trim()}));
  const parties = [...P.values()].filter(p => (p.name||"").trim()).map(p => ({name:p.name.trim(), phone:String(p.phone||"").replace(/\D/g,"").slice(-10), credit:p.creditDays==="" || p.creditDays==null ? null : num(p.creditDays)}));
  // skip bills already in Bahi (same party, date and total), counting repeats
  const have = new Map(), bk = (pn, d, tot) => [pn.toLowerCase(), d, r2(tot)].join("|");
  for(const b of S.bills){ const p = partyById(b.pid); if(p){ const k = bk(p.name, b.date, b.total); have.set(k, (have.get(k)||0) + 1); } }
  const addBills = []; let skipB = 0;
  for(const b of bills){ const k = bk(b.party, b.date, b.total); if(have.get(k) > 0){ have.set(k, have.get(k)-1); skipB++; } else addBills.push(b); }
  const ep = planImport(ents);
  return {bills:addBills, skipB, ents:ep.add, skipE:ep.skip, parties, items,
    newItems:items.filter(x => !findItem(x.name)).length, partyCount:new Set(parties.map(p=>p.name.toLowerCase())).size};
}
function runNakalImport(pl){
  snap();
  for(const p of pl.parties){ const ex = findParty(p.name); if(!ex) S.parties.push({id:nid(), name:p.name, phone:p.phone, credit:p.credit}); else if(!ex.phone && p.phone) ex.phone = p.phone; }
  for(const x of pl.items) if(!findItem(x.name)) S.items.push({id:nid(), name:x.name, rate:x.rate, unit:x.unit});
  const used = new Set(S.bills.map(b => b.no));
  for(const b of [...pl.bills].sort((a,c)=> a.date<c.date?-1:a.date>c.date?1:a.no-c.no)){
    const p = ensureParty(b.party), no = (b.no && !used.has(b.no)) ? b.no : Math.max(S.billSeq, ...used, 0) + 1;
    used.add(no); S.billSeq = Math.max(S.billSeq, no + 1);
    const bill = {id:nid(), no, pid:p.id, date:b.date, rows:b.rows, transport:b.transport, tcalc:"", total:b.total};
    S.bills.push(bill);
    S.entries.push({id:nid(), pid:p.id, type:"bill", amt:b.total, date:b.date, note:t("billNo", no), billId:bill.id});
    b.rows.forEach(r => { if(r.item && !findItem(r.item)) S.items.push({id:nid(), name:r.item, rate:r.rate, unit:""}); });
  }
  for(const r of pl.ents){ const p = ensureParty(r.party); S.entries.push({id:nid(), pid:p.id, type:r.type, amt:r.amt, date:r.date, note:r.note}); }
  commit(); UI.sheet = null; UI.tab = "parties"; render(); toast(t("nkDone", pl.bills.length, pl.ents.length), true);
}

function setDate(v){ const s = UI.sheet, path = s.path; setPath(D, path, v);
  if(s.back){ UI.sheet = s.back; render(); return; }        // came from another sheet (edit entry): go back to it
  UI.sheet = null; render(); if(path==="led.date" && partyById(UI.pid)) focusField("led.amt"); }
function bad(path){ const el = fldEl(path); if(el){ el.classList.remove("bad"); void el.offsetWidth; el.classList.add("bad"); } focusField(path); }
function busy(el,on){ if(el) el.classList.toggle("busy", on); }

async function createVault(pin, book){
  V = {salt:randB64(16), iter:KDF_ITER}; KEY = await deriveKey(pin, V.salt, V.iter); S = book; S.set.lang = LANG; ls.del(LS_TRY); await saveNow();
}
async function eraseAll(){
  const unlocked = !!S;            // from the lock screen (forgot PIN) only this device is cleared
  ls.del(LS_VAULT); ls.del(LS_TRY); ls.del(LS_UI); ls.del(LS_PREV); ls.del(LS_SYNCED);
  try{ if(Cloud.col && unlocked){ await Cloud.col.doc("meta").delete(); } }catch(e){}
  if(Cloud.db==="google"){ try{ await firebase.auth().signOut(); }catch(e){} ls.del(LS_G); FB.user = null; Cloud.db = null; Cloud.col = null; }
  Cloud.vault = null; Cloud.pending = null; S = null; KEY = null; V = null; PIN.done = null; PIN.err = "";
  UI.sheet = null; UI.onb = 0; UI.mode = "onb"; UI.pid = null; D.bill = blankBill(); F = null; render();
}
/** Restore: read the chosen file, ask for its PIN, then make it the book. */
async function restoreFile(file){
  let v; try{ v = JSON.parse(await file.text()); }catch(e){ return toast(t("badFile")); }
  restoreVault(v);
}
/** Restore any Bahi backup (from any version): ask its PIN, open it, bring it up to date. */
function restoreVault(v){
  if(!v || v.app!=="bahi" || !v.ct || !v.salt) return toast(t("badFile"));
  const was = UI.mode;
  const go = async () => {
    PIN.err = ""; openSheet({type:"pin"});
    const pin = await askPin(t("backupPin"), ""); if(!UI.sheet || UI.sheet.type!=="pin") return;
    try{
      const key = await deriveKey(pin, v.salt, v.iter), book = migrate(await decryptObj(key, v));
      V = {salt:v.salt, iter:v.iter}; KEY = key; S = book; S.rev = Date.now(); ls.del(LS_TRY);
      await saveNow(); PIN.err = ""; UI.sheet = null; UI.tab = "bill"; enterApp(); toast(t("restored"));
    }catch(e){ PIN.err = ""; closeSheet(); toast(t("badPin")); }
  };
  if(was==="app") openSheet({type:"confirm", title:t("restoreAsk"), sub:t("restoreSub", fdate(iso(new Date(v.rev||Date.now())),true)), yes:t("restoreYes"), danger:true, run:go}); else go();
}

/* ---- Auto-lock when idle or when the app was in the background ---- */
let idleTimer = 0, hiddenAt = 0;
function armIdle(){ clearTimeout(idleTimer); if(UI.mode==="app" && S) idleTimer = setTimeout(lockNow, S.set.lock*60000); }
document.addEventListener("visibilitychange", () => {
  if(document.hidden){ hiddenAt = Date.now(); if(S) saveNow(); }
  else if(UI.mode==="app" && S && hiddenAt && Date.now()-hiddenAt > S.set.lock*60000) lockNow();
  else if(!document.hidden) cloudRefresh();
});

/* ---- Events: one listener each, everything is delegated ---- */
let rep = 0;
document.addEventListener("pointerdown", e => {
  armIdle();
  const k = e.target.closest("[data-k]");
  if(k || e.target.closest("[data-pin]")){ try{ navigator.vibrate && navigator.vibrate(8); }catch(_){} }
  if(k){ e.preventDefault(); pressKey(k.dataset.k); if(k.dataset.k==="BS"){ clearInterval(rep); const t0 = Date.now(); rep = setInterval(()=>{ if(Date.now()-t0 > 400) typeKey("BS"); }, 70); } return; }
  const pn = e.target.closest("[data-pin]"); if(pn){ e.preventDefault(); return pinKey(pn.dataset.pin); }
  const sg = e.target.closest("[data-sg]"); if(sg){ e.preventDefault(); return pickSugg(+sg.dataset.sg); }
});
["pointerup","pointercancel","pointerleave"].forEach(ev => document.addEventListener(ev, () => clearInterval(rep)));
document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]");
  if(a){ const fn = A[a.dataset.act]; if(fn) fn(a.dataset.arg, a); return; }
  const f = e.target.closest(".fld"); if(f) return focusField(f.dataset.path);
  if(e.target.id==="sheet" && UI.sheet && UI.sheet.type!=="pin" && UI.sheet.type!=="gchoice") return closeSheet();
  if(F && e.target.closest("#main,#sheet") && !(UI.tab==="led" && UI.mode==="app" && !UI.sheet)) blurField();
});
document.addEventListener("keydown", e => {
  armIdle();
  if(e.ctrlKey || e.metaKey) return;
  if(PIN.done && (UI.mode!=="app" || (UI.sheet && UI.sheet.type==="pin"))){ if(/^\d$/.test(e.key)) pinKey(e.key); else if(e.key==="Backspace") pinKey("BS"); return; }
  if(e.altKey && UI.mode==="app" && /^[1-4]$/.test(e.key)){ e.preventDefault(); return A.tab(["bill","led","parties","more"][e.key-1]); }
  if(!F){ if(e.key==="Escape" && UI.sheet) closeSheet(); return; }
  if(e.key==="Enter" || e.key==="Tab"){ e.preventDefault(); return nextField(e.shiftKey); }
  if(e.key==="Escape"){ e.preventDefault(); return UI.sheet ? closeSheet() : blurField(); }
  if(e.key==="Backspace"){ e.preventDefault(); return typeKey("BS"); }
  if(e.key==="Delete"){ e.preventDefault(); return typeKey("CLR"); }
  if(F.path==="led.amt" && /^[pb]$/i.test(e.key)){ e.preventDefault(); return A.addEntry(e.key.toLowerCase()==="p"?"paid":"bill"); }
  if(e.key.length===1){
    e.preventDefault();
    if(F.kind==="text") typeKey(/[a-z]/i.test(e.key) && !e.shiftKey ? caseFor(e.key) : e.key);
    else if(F.kind==="calc" && /^[*xX+]$/.test(e.key)) typeKey(e.key==="+" ? "+" : "×");
    else if(/[\d.]/.test(e.key)) typeKey(e.key);
  }
});
$("#file").addEventListener("change", e => { const f = e.target.files[0]; if(f) restoreFile(f); });
$("#csvfile").addEventListener("change", e => { const f = e.target.files[0]; if(f) importCsvFile(f); });

/* ---- Start-up ---- */
function boot(){
  if(fbAvailable() && !ls.get(LS_G)) setTimeout(()=>{ fbLoad().catch(()=>{}); }, 1500);   // ready for a quick sign-in later
  const ui = ls.get(LS_UI); if(ui && ui.lang) LANG = ui.lang;
  applyPrefs(); render(); cloudInit();
  if(ls.get(LS_VAULT)) lockLoop();                    // a book on this device: go straight to the lock
  else if((!window.claude || !window.claude.use) && !(fbAvailable() && ls.get(LS_G))) boot2();
  // otherwise wait for sync to answer (10 s at most) in case the book lives on another device
}
function boot2(){
  if(UI.mode!=="loading") return;
  if(ls.get(LS_VAULT) || Cloud.vault) lockLoop(); else { UI.mode = "onb"; UI.onb = 0; render(); }
}
/* ---- Website extras: works offline and can be installed like an app (only on a real website) ---- */
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if(UI.mode==="app" && UI.tab==="more") render(); });
try{ if("serviceWorker" in navigator && location.protocol==="https:" && !window.claude) navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){}
boot();
</script>
