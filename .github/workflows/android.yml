name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Prepare web files
        run: npm run web

      - name: Add Android platform
        run: |
          npx cap add android
          npx @capacitor/assets generate --android || echo "icon generation skipped"
          npx cap sync android

      - name: Set version
        run: |
          sed -i -E "s/versionCode( =)? 1$/versionCode\1 ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E "s/versionName( =)? \"1.0\"/versionName\1 \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build release APK and Play bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      # The signing key is never stored in this public repository.
      # With the secrets NAKAL_KEYSTORE_B64 and NAKAL_KEYSTORE_PASS set, every build uses
      # the same key and updates install over the old app. Without them each build gets a
      # one-time key, so the old app must be uninstalled before installing a new build.
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.NAKAL_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.NAKAL_KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > nakal.jks
            PASS="$KS_PASS"
          else
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore nakal.jks -alias nakal -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Nakal"
          fi
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/$BT/zipalign" -f -p 4 "$IN" aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks nakal.jks --ks-key-alias nakal \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out Nakal.apk aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify Nakal.apk
          # The Play Store bundle is only produced with the permanent key.
          if [ -n "$KS_B64" ]; then
            jarsigner -keystore nakal.jks -storepass "$PASS" -keypass "$PASS" -sigalg SHA256withRSA -digestalg SHA-256 \
              -signedjar Nakal.aab android/app/build/outputs/bundle/release/app-release.aab nakal
          fi
          rm -f nakal.jks

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Nakal 1.0.${{ github.run_number }}
          body: |
            Android app for Nakal. Download **Nakal.apk** on your phone and open it to install.
            If an older Nakal is installed, uninstall it first. Bills are kept online, so nothing is lost.
          files: |
            Nakal.apk
            Nakal.aab
