name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update website
        run: git push origin HEAD:gh-pages --force

      # Fails early, with sizes only (never the values), if the signing secrets look wrong.
      - name: Check signing key
        id: key
        env:
          KS_B64: ${{ secrets.NAKAL_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.NAKAL_KEYSTORE_PASS }}
        run: |
          echo "ok=false" >> "$GITHUB_OUTPUT"
          if [ -z "$KS_B64" ]; then echo "No signing key set; a one-time key will be used."; exit 0; fi
          echo "Key secret: $(printf '%s' "$KS_B64" | tr -d '[:space:]' | wc -c) characters without spaces (expected 2828), $(printf '%s\n' "$KS_B64" | wc -l) line(s)"
          echo "Password secret: $(printf '%s' "$KS_PASS" | tr -d '[:space:]' | wc -c) characters (expected 32)"
          printf '%s' "$KS_B64" | tr -d '[:space:]' | base64 -d > /tmp/k.jks 2>/dev/null \
            || printf '%s\n' "$KS_B64" | tr -d ' \r' | awk 'length>m{m=length;l=$0} END{print l}' | base64 -d > /tmp/k.jks || true
          echo "Decoded key file: $(wc -c < /tmp/k.jks) bytes (expected 2120)"
          keytool -list -keystore /tmp/k.jks -storepass "$(printf '%s' "$KS_PASS" | tr -d '[:space:]')" -alias nakal > /dev/null 2>&1 \
            && { echo "Signing key and password are good."; echo "ok=true" >> "$GITHUB_OUTPUT"; } \
            || echo "::warning::The signing key or its password is wrong or incomplete. Using a one-time key; the Play bundle is left unsigned."
          rm -f /tmp/k.jks

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Prepare web files
        run: npm run web

      - name: Add Android platform
        run: |
          npx cap add android
          npx @capacitor/assets generate --android || echo "icon generation skipped"
          npx cap sync android

      - name: Set version
        run: |
          sed -i -E "s/versionCode( =)? 1$/versionCode\1 ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E "s/versionName( =)? \"1.0\"/versionName\1 \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build release APK and Play bundle
        working-directory: android
        run: |
          chmod +x gradlew
          # Maven Central sometimes answers "Too Many Requests"; wait and try again.
          for n in 1 2 3; do
            ./gradlew assembleRelease bundleRelease --no-daemon && exit 0
            echo "Build attempt $n failed; retrying in 60s"; sleep 60
          done
          exit 1

      # The signing key is never stored in this public repository.
      # With the secrets NAKAL_KEYSTORE_B64 and NAKAL_KEYSTORE_PASS set, every build uses
      # the same key and updates install over the old app. Without them each build gets a
      # one-time key, so the old app must be uninstalled before installing a new build.
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.NAKAL_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.NAKAL_KEYSTORE_PASS }}
          KEY_OK: ${{ steps.key.outputs.ok }}
        run: |
          if [ "$KEY_OK" = "true" ]; then
            # Accept the key even if it was pasted with line breaks or with the rest of the notes file.
            printf '%s' "$KS_B64" | tr -d '[:space:]' | base64 -d > nakal.jks 2>/dev/null \
              || printf '%s\n' "$KS_B64" | tr -d ' \r' | awk 'length>m{m=length;l=$0} END{print l}' | base64 -d > nakal.jks \
              || { echo "::error::NAKAL_KEYSTORE_B64 is not valid. Paste only the long single line from nakal-signing-key.txt."; exit 1; }
            PASS=$(printf '%s' "$KS_PASS" | tr -d '[:space:]')
            keytool -list -keystore nakal.jks -storepass "$PASS" -alias nakal > /dev/null \
              || { echo "::error::The signing key or its password is wrong or incomplete. Check both secrets."; exit 1; }
          else
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore nakal.jks -alias nakal -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Nakal"
          fi
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/$BT/zipalign" -f -p 4 "$IN" aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks nakal.jks --ks-key-alias nakal \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out Nakal.apk aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify Nakal.apk
          # The Play Store bundle is only produced with the permanent key.
          if [ "$KEY_OK" = "true" ]; then
            jarsigner -keystore nakal.jks -storepass "$PASS" -keypass "$PASS" -sigalg SHA256withRSA -digestalg SHA-256 \
              -signedjar Nakal.aab android/app/build/outputs/bundle/release/app-release.aab nakal
          else
            cp android/app/build/outputs/bundle/release/app-release.aab Nakal-unsigned.aab
          fi
          rm -f nakal.jks

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Nakal 1.0.${{ github.run_number }}
          body: |
            Android app for Nakal. Download **Nakal.apk** on your phone and open it to install.
            If an older Nakal is installed, uninstall it first. Bills are kept online, so nothing is lost.
          files: |
            Nakal.apk
            Nakal.aab
            Nakal-unsigned.aab
